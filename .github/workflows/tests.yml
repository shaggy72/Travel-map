# Automatische tests: bij elke push en pull request, en elke nacht (04:00 Belgische zomertijd).
# 's Nachts ook een controle of de echte site bereikbaar is. Mislukt er iets, dan mailt GitHub je.
# 's Nachts alleen bij nieuwe code in de afgelopen 24 uur (minuten sparen); zonder commits slaan de jobs over.
# De tests hebben geen npm-pakketten nodig (enkel Node), dus geen `npm ci` van de zware Remotion-installatie.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

# Een nieuwere push annuleert de lopende run van dezelfde branch.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROD_URL: https://travelmap.luyens.be

jobs:
  changes:
    # Enkel 's nachts: nieuwe code in de afgelopen 24 uur? Zonder commits slaan de nachtelijke jobs over (minuten sparen).
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          if [ -n "$(git log --since='24 hours ago' --format=%H)" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
  server:
    name: Servertests
    needs: [changes]
    if: github.event_name != 'schedule' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # zelfde als de VPS
      - run: node --test "server/test/*.test.js"

  production:
    name: Site bereikbaar
    needs: [changes]
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (github.event_name != 'schedule' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 20 "$PROD_URL/" -o /dev/null

  # Pakket-updates van Dependabot (kleine updates en beveiligingsfixes) worden pas samengevoegd als alle tests hierboven groen zijn.
  # Staat standaard UIT: zet de repo-variabele AUTOMERGE op true (gh variable set AUTOMERGE --body true). Grote versiesprongen nooit automatisch.
  automerge:
    name: Dependabot samenvoegen
    needs: [server]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && vars.AUTOMERGE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
