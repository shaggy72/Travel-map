# /etc/nginx/sites-available/NAAM   (vervang NAAM en POORT; daarna: ln -s naar sites-enabled, nginx -t, systemctl reload nginx,
# certbot --nginx -d NAAM.luyens.be). Certbot voegt zelf het https-gedeelte toe.
server {
    listen 80;
    server_name NAAM.luyens.be;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:POORT;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
